# Syntax + regression checks. No package install: every check runs on plain node.
# client.js is assembled from src/client/*.js by tools/build-client.mjs; the drift
# check makes sure a committed artifact always matches its source fragments.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: client artifact in sync with source fragments
        run: npm run check:client
      - name: syntax check
        run: npm run check
      - name: regression tests
        run: npm test
