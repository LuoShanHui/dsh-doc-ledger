# Syntax + regression checks. The plugin has no build step and no dependencies, so
# there is nothing to install: the engine and the decoder are pure ESM modules and the
# two check scripts run on plain node.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: npm run check
      - name: regression tests
        run: npm test
